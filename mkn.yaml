#! clean build -dtOa "-std=c++20 -fPIC" -p iwyu

name: cpp.iwyu
property:
  # dependency versions: master on master (not the default branch: mkn.mod's is
  #  the rolling latest, whose mkn.kul differs from a master project's)
  mkn.mod.version: latest
version: master

parent: base
src: mod.cpp
mode: shared

profile:
- name: base
  dep: mkn.mod#${mkn.mod.version}
  if_arg:
      shared: -DMKN_KUL_SHARED

- name: format
  mod: |
    clang.format#latest{init{style: file, paths: .}}

# runs iwyu over this module's own source and applies its suggestions
- name: iwyu
  parent: base
  src: mod.cpp
  # inline form, the list form resolves the module from the default branch in CI
  mod: |
    cpp.iwyu#latest{compile{fix: --nocomments --nosafe_headers, system_last: true}}
