#! clean build -dtOa "-std=c++20 -fPIC" -p iwyu

name: cpp.iwyu
version: master

parent: base
src: mod.cpp
mode: shared

profile:
- name: base
  dep: mkn.mod
  if_arg:
      win_shared: -DYAML_CPP_DLL
      shared: -DMKN_KUL_SHARED

- name: format
  mod: |
    clang.format{init{style: file, paths: .}}

# runs iwyu over this module's own source and applies its suggestions
- name: iwyu
  parent: base
  src: mod.cpp
  # inline form, the list form resolves the module from the default branch in CI
  mod: |
    cpp.iwyu{compile{fix: --nocomments --nosafe_headers, system_last: true}}
